name: codeatlas-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: codeatlas
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - codeatlas_dev_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - codeatlas_dev_redis:/data

volumes:
  codeatlas_dev_postgres:
  codeatlas_dev_redis:
