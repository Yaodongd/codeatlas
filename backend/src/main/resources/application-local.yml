spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/codeatlas}
    username: ${POSTGRES_USER:codeatlas}
    password: ${POSTGRES_PASSWORD:codeatlas}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD:}

codeatlas:
  repository-storage: ${REPOSITORY_STORAGE:./data/repositories}
